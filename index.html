<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パークヒルズMAP</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
    }

    #map {
      width: 100%;
      height: 100vh;
      background: #ffffff;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================
   MAP
========================= */

const map = L.map('map', {
  zoomControl: true
});

/* =========================
   表示範囲
========================= */

const bounds = [
  [34.37465, 132.38680], // 南西
  [34.41831, 132.44448]  // 北東
];

map.fitBounds(bounds);

/* =========================
   白背景地図
========================= */

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
  {
    subdomains: 'abcd',
    maxZoom: 20,
    attribution:
      '&copy; OpenStreetMap contributors &copy; CARTO'
  }
).addTo(map);

/* =========================
   パークヒルズ
========================= */

const parkHills = [34.3955, 132.4156];

L.circleMarker(parkHills, {
  radius: 10,
  color: '#1b2a41',
  fillColor: '#1b2a41',
  fillOpacity: 1,
  weight: 0
}).addTo(map);

L.marker(parkHills, {
  icon: L.divIcon({
    className: '',
    html: `
      <div style="
        font-size:14px;
        font-weight:bold;
        color:#1b2a41;
        white-space:nowrap;
      ">
        PARK HILLS
      </div>
    `,
    iconSize: [120, 20],
    iconAnchor: [-10, 10]
  })
}).addTo(map);

</script>

</body>
</html>
