const map = L.map('map', {
  zoomControl: true
});

// 指定範囲
const bounds = [
  [34.37465, 132.38680], // 左下
  [34.41831, 132.44448]  // 右上
];

map.fitBounds(bounds);

// 白背景・地名なし
const baseCarto = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
  {
    subdomains: 'abcd',
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  }
).addTo(map);
