<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パークヒルズMAP（埋め込み）</title>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: sans-serif;
    }

    .map-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    .map-frame {
      width: 100%;
      height: 520px;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    p {
      margin: 0 0 12px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="map-wrapper">
    <h2>パークヒルズ周辺MAP</h2>
    <p>広島市西区高須周辺</p>

    <div class="map-frame">
      <iframe src="index.html?v=4"></iframe>
    </div>
  </div>

</body>
</html>
